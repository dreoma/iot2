services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot_core
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_core"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./iot-core/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rules-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot_rules
      POSTGRES_USER: rules_user
      POSTGRES_PASSWORD: rules_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rules_user -d iot_rules"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rules_data:/var/lib/postgresql/data
      - ./iot-core/db/rules.sql:/docker-entrypoint-initdb.d/init.sql:ro

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
      rules-db:
        condition: service_healthy
    volumes:
      - ./iot-core/db/telemetry_context.sql:/migrations/telemetry_context.sql:ro
      - ./iot-core/db/notification_context.sql:/migrations/notification_context.sql:ro
      - ./iot-core/db/user_auth.sql:/migrations/user_auth.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        PGPASSWORD=iot_password psql -h db -U iot_user -d iot_core -v ON_ERROR_STOP=1 -f /migrations/telemetry_context.sql
        PGPASSWORD=iot_password psql -h db -U iot_user -d iot_core -v ON_ERROR_STOP=1 -f /migrations/user_auth.sql
        PGPASSWORD=rules_password psql -h rules-db -U rules_user -d iot_rules -v ON_ERROR_STOP=1 -f /migrations/notification_context.sql

  iot-core:
    build:
      context: .
      dockerfile: iot-core/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rules-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      TRAFFIC_KEY_HEX: ${TRAFFIC_KEY_HEX}
      IOT_SMTP_URL: ${IOT_SMTP_URL-smtp://mailpit:1025}
      IOT_SMTP_FROM: ${IOT_SMTP_FROM:-iot@example.com}

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  core-tls:
    build: ./front
    depends_on:
      - iot-core
    volumes:
      - ./nginx/core-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
    ports:
      - "8443:8443"

  http-adapter:
    build:
      context: .
      dockerfile: http-adapter/Dockerfile
    depends_on:
      - core-tls
    environment:
      CORE_URL: https://core-tls:8443
      CORE_CA_FILE: /certs/ca.crt
      TRAFFIC_KEY_HEX: ${TRAFFIC_KEY_HEX}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    ports:
      - "8081:8081"

volumes:
  postgres_data:
  rules_data:
