map "$request_method:$uri" $password_client {
    default "";
    ~*^POST:/+api/v1/(users|auth/+login)/?$ $binary_remote_addr;
    ~*^PUT:/+auth/+password/?$       $binary_remote_addr;
}

limit_req_zone $password_client zone=passwords:1m rate=30r/m;

server {
    listen 8443 ssl;
    server_name core-tls;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 302 /app/;
    }

    location = /app {
        return 302 /app/;
    }

    location = /app/ {
        root /usr/share/nginx/html;
        try_files /app/index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
    }

    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        limit_req zone=passwords burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://iot-core:8080;
        proxy_set_header Host $host;
    }
}
